services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      DATABASE_URL: postgresql://agentic:agentic@db:5432/agentic_ops
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      DEMO_MODE: ${DEMO_MODE:-1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
