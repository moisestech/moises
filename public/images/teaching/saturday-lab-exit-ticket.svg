<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Saturday Lab exit ticket instrument</title>
  <desc id="desc">Designed closing questions. Completed learner responses are not published.</desc>
  <defs>
    <linearGradient id="exitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#ebe4d8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="620" fill="url(#exitBg)"/>
  <rect x="40" y="32" width="880" height="556" rx="20" fill="#fffdf8" stroke="#d6d3d1"/>
  <rect x="40" y="32" width="12" height="556" rx="6" fill="#7c3aed"/>
  <text x="80" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="1.4">TEACH · ASSESSMENT INSTRUMENT</text>
  <text x="80" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1c1917">Saturday Lab — Exit ticket</text>
  <text x="80" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#57534e">Designed instrument — not a published score or attendance report</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="80" y="180" width="780" height="100" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
    <circle cx="112" cy="214" r="16" fill="#7c3aed"/>
    <text x="112" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="144" y="220" font-size="16" font-weight="600" fill="#292524">What did you ship or change today?</text>
    <rect x="144" y="236" width="680" height="28" rx="6" fill="#fff" stroke="#e9d5ff"/>
    <rect x="80" y="296" width="780" height="100" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
    <circle cx="112" cy="330" r="16" fill="#7c3aed"/>
    <text x="112" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="144" y="336" font-size="16" font-weight="600" fill="#292524">Where did you get stuck (deploy, domain, tool, or review)?</text>
    <rect x="144" y="352" width="680" height="28" rx="6" fill="#fff" stroke="#e9d5ff"/>
    <rect x="80" y="412" width="780" height="100" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
    <circle cx="112" cy="446" r="16" fill="#7c3aed"/>
    <text x="112" y="451" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="144" y="452" font-size="16" font-weight="600" fill="#292524">What would you try next, and who can operate it without you?</text>
    <rect x="144" y="468" width="680" height="28" rx="6" fill="#fff" stroke="#e9d5ff"/>
  </g>
  <text x="80" y="554" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#78716c">Source: Saturday Lab print/exit-ticket.md — dcc.miami</text>
</svg>
